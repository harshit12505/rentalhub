spring:
  application:
    name: rentalhub

  profiles:
    # With no profile chosen, run as "local" (see application-local.yml).
    # Render sets SPRING_PROFILES_ACTIVE=render instead.
    default: local

  # Gemini through the Developer API: a plain key from Google AI Studio, not Vertex AI
  # (which would need a Google Cloud project and a service account). With no key set,
  # AiEnvironmentPostProcessor switches all of this off and the app runs without AI.
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: gemini-2.5-flash
            # Low, not zero: a recommendation should read naturally but stay predictable.
            temperature: 0.2
        embedding:
          api-key: ${GEMINI_API_KEY:}
          text:
            options:
              model: gemini-embedding-001
              # 768 numbers per listing: pgvector's index stops at 2,000 dimensions,
              # and this model's default is 3,072.
              dimensions: 768
              # One task type for both sides: the vector store embeds search queries with this
              # same model bean, so documents and queries are compared like with like.
              task-type: SEMANTIC_SIMILARITY
    vectorstore:
      pgvector:
        # Flyway owns the schema (V4); the store must never create or alter tables.
        initialize-schema: false
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE

  datasource:
    # Assembled from parts rather than taken as one URL: Render provides host, port,
    # database, user and password separately, and its ready-made connection string
    # uses the postgres:// scheme, which the JDBC driver does not accept.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rentalhub}
    username: ${DB_USERNAME:rentalhub}
    password: ${DB_PASSWORD:rentalhub}

  jpa:
    hibernate:
      # Flyway owns the schema. 'validate' makes Hibernate check at startup that the
      # entities match the tables and refuse to start if they drift; it never alters
      # the schema itself.
      ddl-auto: validate
    # Off: the database session closes when the service method returns, so a view can
    # never trigger surprise lazy-loading queries. Services load what views need.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
      # Hibernate Envers (auditing). The history tables are created by Flyway (V2).
      org:
        hibernate:
          envers:
            # Lower-case names, the way Postgres stores them: properties_aud, not properties_AUD.
            audit_table_suffix: _aud
            revision_field_name: rev
            revision_type_field_name: revtype
            # A deleted row's last state is kept in its DEL history row, so the history
            # of a deleted listing still says what it was and whose it was.
            store_data_at_delete: true

  flyway:
    locations: classpath:db/migration

  data:
    redis:
      # One URL, because that is what Render's Key Value service hands out.
      # Locally it points at the Redis in docker-compose.yml.
      url: ${REDIS_URL:redis://localhost:6379}
      # Fail fast. Redis is an optimisation: after this long a cache call gives up
      # and the request reads the database instead of waiting on a sick Redis.
      timeout: 500ms
      connect-timeout: 1s
      # Redis is only a cache here, never a Spring Data repository store.
      repositories:
        enabled: false

  messages:
    basename: messages
    encoding: UTF-8
    # A missing translation falls back to messages.properties (English), never to
    # whatever language the server's operating system happens to be set to.
    fallback-to-system-locale: false

  graphql:
    # A browser page for trying queries: /graphiql.
    graphiql:
      enabled: true

  mvc:
    format:
      # Dates in forms the ISO way (2027-03-10), whatever the page's language: that is what a
      # browser's <input type="date"> sends and expects back.
      date: iso

  servlet:
    multipart:
      # Photos only: 5 MB each (rentalhub.images.max-size checks the same), plus room for
      # the form around them.
      max-file-size: 5MB
      max-request-size: 6MB
      # Read the upload when the controller asks for it, not before the request reaches it:
      # then a too-large file is refused by the API's own error handling, in the caller's
      # language, instead of by the servlet container.
      resolve-lazily: true

server:
  # Render assigns the port through the PORT environment variable.
  port: ${PORT:8080}
  servlet:
    session:
      # The pages' "signed in as" lives in the session. SameSite=Lax: the browser sends the
      # cookie when someone follows a link here, but not with a form another site posts here,
      # so a stranger's page cannot book or cancel as the signed-in user (there is no CSRF
      # token: no Spring Security, by the spec). HttpOnly: page scripts cannot read it.
      cookie:
        same-site: lax
        http-only: true
      timeout: 2h
      # Only ever in the cookie. Otherwise Tomcat writes it into the URL (/;jsessionid=...) on the
      # first redirect, before it knows the browser keeps cookies: a session id in an address
      # leaks through logs, bookmarks and the Referer header.
      tracking-modes: cookie
  tomcat:
    # A photo over the limit is refused from its size alone, before its bytes are read. Tomcat
    # then reads and throws away the rest of the upload, up to this much, so that the browser gets
    # the answer (the listing again, with the reason); past it, Tomcat closes the connection and
    # the browser shows its own "connection reset" page. The default, 2 MB, is less than one
    # phone photo.
    max-swallow-size: 50MB

# The OpenAPI description (/v3/api-docs) and Swagger UI (/swagger-ui.html): the API's own
# paths only, not Spring's (the actuator, the GraphQL endpoint).
springdoc:
  paths-to-match: /api/**, /images/**
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    # Try-it-out opens with the example filled in, so a request can be sent at once.
    try-it-out-enabled: true

logging:
  pattern:
    # Spring Boot's console layout, trimmed, plus two things:
    #   %X{requestId}  the request's id from the MDC (blank outside a web request);
    #   %kvp{NONE}     the event's key/value pairs after the message, as key=value.
    # So a line reads "booking.created bookingId=1 propertyId=2 ...". The render profile
    # switches to JSON instead (application-render.yml), where each pair is its own field.
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-8X{requestId}){magenta} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m %kvp{NONE}%n%wEx"

management:
  endpoints:
    web:
      exposure:
        # caches: GET /actuator/caches lists every cache and its type
        include: health,info,caches
  endpoint:
    health:
      status:
        # DEGRADED (see SharedCacheHealthIndicator): worse than UP, better than DOWN. A status
        # that isn't DOWN or OUT_OF_SERVICE answers HTTP 200, so a platform's health check keeps
        # the site up while it works without Redis.
        order: down,out-of-service,degraded,up,unknown
  health:
    # Replaced by SharedCacheHealthIndicator: Boot's own check says DOWN when Redis is away,
    # which would fail the whole app's health for a cache it can live without.
    redis:
      enabled: false

# Cache tuning; see CacheSettings for what each value means and why.
rentalhub:
  # The demo world (bootstrap/DemoDataSeeder): created on start-up when the database has no users
  # at all, so a fresh install or deployment never opens blank. Never touches a database with data.
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}
  cache:
    # Bump the version when a cached record's shape changes, so new code never
    # reads old-shaped JSON; old keys simply expire. v2 (phase 5): listings and search
    # results gained displayPrice. v3 (phase 7): a listing's images gained their id.
    key-prefix: "rentalhub:v3:"
    listing-local-ttl: 30s
    listing-local-max-size: 10000
    listing-shared-ttl: 10m
    search-ttl: 5m
  # Booking rules and retry tuning; see BookingSettings.
  booking:
    # Longest stay a single booking may cover.
    max-nights: 90
    # A booking that loses a race for its listing is retried: at most 3 more attempts,
    # waiting about 50 ms, then 100, then 200 (never over 500), each shifted by up to 25 ms.
    retry:
      max-retries: 3
      delay: 50ms
      multiplier: 2
      jitter: 25ms
      max-delay: 500ms
  # Payments; see config/StripeConfig and service/PaymentService.
  payments:
    stripe:
      # A Stripe test-mode secret key (sk_test_...). Without one, payments are simulated:
      # nothing is charged, and bookings say SIMULATED. A live key is refused.
      secret-key: ${STRIPE_SECRET_KEY:}
      # Empty means Stripe itself. Set only to point at stripe-mock, Stripe's offline mock.
      api-base: ${STRIPE_API_BASE:}
      connect-timeout: 5s
      read-timeout: 20s
      # Repeats of a request whose answer was lost, by the Stripe library itself. Safe:
      # every request carries an idempotency key.
      max-network-retries: 2
  # Prices shown in other currencies, and compared across them; see service/CurrencyService.
  fx:
    # The currency maxPrice is read in when a search doesn't say.
    default-currency: INR
    # ExchangeRate-API's free endpoint: no key, updated daily, asks for at most ~1 call an hour.
    rates-url: ${FX_RATES_URL:https://open.er-api.com/v6/latest/USD}
    refresh-after: 1h
    # Rates older than this are not shown; until then, the last good set covers an outage.
    max-age: 48h
    # After a failed fetch, wait this long before trying again.
    retry-after: 1m
    connect-timeout: 2s
    read-timeout: 3s
  # Background jobs; see scheduling/.
  jobs:
    stale-listings:
      # Spring cron: second minute hour day-of-month month day-of-week.
      # Daily at 03:15. Set to "-" to switch the job off.
      cron: "${STALE_LISTINGS_CRON:0 15 3 * * *}"
      zone: "${STALE_LISTINGS_ZONE:UTC}"
    payment-reconciliation:
      # Every 5 minutes. "-" switches it off.
      cron: "${PAYMENT_RECONCILIATION_CRON:0 */5 * * * *}"
      # A payment still undecided after this long is looked up at the provider. Far longer
      # than a live payment can take (Stripe's read timeout times its retries), so the job
      # never races a payment that is still under way.
      stale-after: ${PAYMENT_STALE_AFTER:10m}
  # Listing photos; see storage/ and service/ListingImageService.
  images:
    max-size: 5MB
    max-per-listing: 10
    s3:
      # No bucket, no uploads: the rest of the app works as usual and an upload is
      # answered with a clear 503.
      bucket: ${S3_BUCKET:}
      region: ${AWS_REGION:ap-south-1}
      # Only for an S3-compatible server such as MinIO (e.g. http://localhost:9000);
      # leave empty for AWS itself.
      endpoint: ${S3_ENDPOINT:}
      path-style: ${S3_PATH_STYLE:false}
      # The AWS SDK's own variable names. Leave both empty to use the SDK's default
      # credential chain (a profile in ~/.aws, or a role on AWS hardware).
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
  # The AI features; see ai/ and docs/learning/06-ai-rag.md.
  ai:
    # How many listings the vector search brings back before the SQL filters run.
    # Wider than the answer needs, because the filters will drop some of them.
    candidates: 50
    # The most listings one recommendation may mention.
    max-recommendations: 5
    # Listings are embedded as soon as they change. This job picks up the ones that
    # were missed: created while no key was set, or an embedding call that failed.
    index-job:
      cron: "${EMBEDDING_INDEX_CRON:0 0/2 * * * *}"
      batch-size: 20
