# RentalHub messages: English, and the fallback for every other language.
#
# Code throws message KEYS; this file turns them into text. messages_hi and
# messages_es must have exactly the same keys and placeholders (MessagesFilesTest).
#
# Messages with {0}-style arguments go through java.text.MessageFormat, where a
# single apostrophe is an escape character and must be written twice (''). The
# simplest rule: avoid apostrophes in messages.
# {max} / {value} are filled in by bean validation from the annotation itself.

# --- Generic field validation (bean validation on request objects) ---
validation.required=This field is required.
validation.maxLength=Must be at most {max} characters.
validation.min=Must be at least {value}.

