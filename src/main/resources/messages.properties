# RentalHub messages: English, and the fallback for every other language.
#
# Code throws message KEYS; this file turns them into text. Hindi and Spanish
# versions (messages_hi / messages_es) arrive in phase 7 with the same keys.
#
# Messages with {0}-style arguments go through java.text.MessageFormat, where a
# single apostrophe is an escape character and must be written twice (''). The
# simplest rule: avoid apostrophes in messages.
# {max} / {value} are filled in by bean validation from the annotation itself.

# --- Generic field validation (bean validation on request objects) ---
validation.required=This field is required.
validation.maxLength=Must be at most {max} characters.
validation.min=Must be at least {value}.

# --- Error response titles, by HTTP status ---
error.title.400=The request was not valid
error.title.403=Not allowed
error.title.404=Not found
error.title.402=Payment failed
error.title.409=Conflict with the current state
error.title.503=Temporarily unavailable
error.validation.detail=Some fields are not valid.
error.concurrentUpdate=Someone else changed this at the same moment. Reload it and try again.

# --- Lookups and permissions ({0,number,#} prints an id without a thousands separator) ---
property.notFound=There is no listing with id {0,number,#}.
user.notFound=There is no user with id {0,number,#}.
property.create.notHost=Only hosts can create listings.
property.notOwner=Only the host of this listing can change it.
property.delete.hasBookings=This listing has bookings, so it cannot be deleted.
property.type.cannotChange=The type of an existing listing cannot be changed.

# --- Listings: rules every property type shares ---
property.type.required=Choose a property type.
property.currency.required=Choose a currency.
property.price.positive=Price per night must be greater than zero.
property.price.precision=Price per night can have at most {0} decimal places in this currency.
property.price.digits=Price per night is too large.
property.guests.min=A listing must sleep at least one guest.
property.bedrooms.negative=Bedrooms cannot be negative.
property.bathrooms.negative=Bathrooms cannot be negative.
property.availableUntil.past=The availability end date cannot be in the past.

# --- Listings: checks applied to every type-specific attribute ({0} is its label) ---
property.attribute.required={0} is required for this type of property.
property.attribute.format={0} has a value that could not be read.
property.attribute.choice={0} must be one of the listed options.
property.attribute.unknown="{0}" does not apply to this type of property.

# --- Apartment ---
property.apartment.floor.negative=Floor number cannot be negative.
property.apartment.elevator.required=Apartments above floor {0} must say whether there is a lift.
property.apartment.bedrooms.min=An apartment needs at least one bedroom. Single-room homes are listed as studios.

# --- Villa ---
property.villa.plotArea.min=A villa needs a plot of at least {0} m².
property.villa.guests.min=A villa must sleep at least {0} guests. Smaller homes are better listed as apartments.
property.villa.bedrooms.min=A villa needs at least {0} bedrooms.

# --- Cabin ---
property.cabin.distance.range=Distance to town must be between 0 and {0} km.

# --- Studio ---
property.studio.guests.max=A studio can sleep at most {0} guests.
property.studio.area.min=A studio must be at least {0} m².

# --- Bookings ---
booking.notFound=There is no booking with id {0,number,#}.
booking.notYours=Only the guest who made this booking, or the host of the listing, can see or change it.
booking.listing.notHost=Only the host of this listing can see its bookings.
booking.ownListing=You cannot book your own listing.
booking.property.inactive=This listing is not taking bookings at the moment.
booking.guests.min=At least one guest must stay.
booking.guests.tooMany=This listing sleeps at most {0} guests.
booking.checkIn.past=Check-in cannot be in the past.
booking.checkOut.beforeCheckIn=Check-out must be at least one day after check-in.
booking.checkOut.beyondAvailability=This listing can be booked only until {0}.
booking.nights.max=A single booking can be at most {0} nights.
booking.dates.unavailable=Those dates are already booked. Please choose different dates.
booking.dates.justTaken=Those dates were just taken by another guest. Please choose different dates.
booking.cancel.tooLate=This booking can no longer be cancelled, because the stay has already started.
booking.cancel.paymentPending=The payment for this booking is still being processed. Try again in a few minutes.
booking.paymentMethod.format=Give a payment method id, such as pm_card_visa.

