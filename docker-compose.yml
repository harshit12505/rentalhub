# Runs ONLY the two external services RentalHub needs.
# The app itself runs from your IDE / `mvn spring-boot:run` so you get fast restarts.
#
#   docker compose up -d
#
services:
  postgres:
    # Official pgvector image = Postgres 16 with the vector extension already available.
    image: pgvector/pgvector:pg16
    container_name: rentalhub-postgres
    environment:
      POSTGRES_DB: rentalhub
      POSTGRES_USER: rentalhub
      POSTGRES_PASSWORD: rentalhub
    ports:
      - "5432:5432"
    volumes:
      - rentalhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentalhub -d rentalhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rentalhub-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional, and never deployed: an S3-compatible store for trying photo uploads without an
  # AWS account. Not started by `docker compose up -d`; start it with
  #   docker compose --profile photos up -d
  # (MinIO stopped publishing on Docker Hub; its community image lives on quay.io, pinned.)
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: rentalhub-minio
    profiles: ["photos"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rentalhub
      MINIO_ROOT_PASSWORD: rentalhub-secret
    ports:
      - "9000:9000"   # the S3 API (S3_ENDPOINT=http://localhost:9000)
      - "9001:9001"   # a web console for looking inside the bucket
    volumes:
      - rentalhub-photos:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rentalhub-pgdata:
  rentalhub-photos:
